<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/oops-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management System</title>
    <meta name="description" content="Comprehensive unit conversion system with cost calculations for mass, volume, and packaged goods. Perfect for restaurant management, inventory planning, and recipe costing." />
    <meta name="author" content="" />
    <meta property="og:title" content="Inventory Management System" />
    
    <!-- Performance optimizations -->
    <link rel="preconnect" href="http://localhost:3000" crossorigin />
    <link rel="dns-prefetch" href="http://localhost:3000" />
    
    <!-- Critical CSS inline to avoid render blocking -->
    <style>
      /* Critical CSS for initial render */
      body, html { margin: 0; padding: 0; height: 100%; }
      #root { height: 100%; display: flex; flex-direction: column; }
      .loading-spinner { display: flex; align-items: center; justify-content: center; height: 100vh; }
      .loading-spinner:after { content: ''; width: 50px; height: 50px; border: 2px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 100%; will-change: transform; animation: spin 1s infinite linear; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="/src/main.tsx" as="script" type="module" />
    
    <!-- Add meta theme color for mobile browsers -->
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <!-- Initial loading state that will be shown before JS loads -->
    <div id="root">
      <div class="loading-spinner"></div>
    </div>
    
    <!-- Defer non-critical JS -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
